name: unzip icons
on:
  push:
    paths: ["icons.zip"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack icons.zip into icons/
        run: |
          mkdir -p icons
          unzip -o -q icons.zip -d icons
          git rm -q icons.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add icons
          git commit -m "Unpack item icons"
          git push
